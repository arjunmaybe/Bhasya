# Production-like local infrastructure (Phase 1).
# App code targets these services; Node/PGlite/filesystem adapters are dev-only equivalents.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bhasya
      POSTGRES_PASSWORD: bhasya
      POSTGRES_DB: bhasya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
